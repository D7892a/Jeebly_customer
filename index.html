</style><link rel="stylesheet" href="smart.css"><style>.team-honor-item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #ffffff15}.team-honor-item:last-child{border-bottom:0}.team-honor-icon{font-size:27px}.team-honor-item strong{color:#eac06e}.team-honor-item p{margin:4px 0 0}</style></head><body><div id="app"><header class="header"><div class="brand"><img src="mansouriya-logo.png" alt="شعار الرابطة"><div><strong>رابطة الفرق الشعبية</strong><div class="gold tiny">المنصورية | المنصة الرسمية</div></div></div><button class="mans-menu-button" id="mansOpen" aria-label="فتح قائمة الخدمات" aria-expanded="false">☰</button></header><main id="content"></main><p class="footnote">البيانات تُعرض مباشرة من قاعدة بيانات الرابطة.</p></div><nav class="nav" id="nav"></nav><div class="mans-overlay" id="mansOverlay"><aside class="mans-drawer" role="dialog" aria-label="خدمات الرابطة"><button id="mansClose" aria-label="إغلاق القائمة">✕ إغلاق</button><h2>خدمات الرابطة</h2><input id="mansSearch" placeholder="ابحث عن خدمة..."><div id="mansItems"></div></aside></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const sb=window.supabase.createClient('https://pwxyusskxwupjqocvhci.supabase.co','sb_publishable_aXzO7NpIJCu9GMgw2WMJ1A_-iWx80Yy');
let db={teams:[],tournaments:[],participants:[],matches:[],players:[],staff:[]},page='home',filter='all',search='',selectedTeam=null,selectedTournament=null,profileTab='players',rosterTab='players',loading=true,error='';
const content=document.getElementById('content'),nav=document.getElementById('nav');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons={home:'<path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/>',teams:'<path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11"/>',matches:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',leagues:'<path d="M8 21h8M12 17v4M7 3h10v7a5 5 0 0 1-10 0zM7 5H4v3a4 4 0 0 0 4 4M17 5h3v3a4 4 0 0 0 4 4"/>'};

function dateText(d){if(!d)return 'الموعد غير محدد';const v=new Date(d);return Number.isNaN(+v)?'الموعد غير محدد':new Intl.DateTimeFormat('ar-IQ',{timeZone:'Asia/Baghdad',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}).format(v)}
function match(m){const a=m.home_team_id?team(m.home_team_id):{name:m.home_guest_name||'فريق خارجي',logo_url:m.home_guest_logo_url},b=m.away_team_id?team(m.away_team_id):{name:m.away_guest_name||'فريق خارجي',logo_url:m.away_guest_logo_url},done=m.status==='finished',live=m.status==='live';return `<div class="card match" data-match-id="${esc(m.id)}"><div class="match-head tiny"><span style="color:#B9BCC6">${esc(tour(m.tournament_id)?.name||m.match_type||'مباراة شعبية')}</span><span class="gold">${done?'انتهت':live?'مباشرة':m.status==='cancelled'?'ملغاة':'قادمة'}</span></div><div class="match-mid"><div class="side">${crest(a)}${esc(a.name)}</div><div class="score">${done||live?`${m.home_score??'-'} - ${m.away_score??'-'}`:'VS'}</div><div class="side">${crest(b)}${esc(b.name)}</div></div><div class="notice" style="text-align:center">${esc(dateText(m.kickoff))} · ${esc(m.venue||'الملعب غير محدد')}</div></div>`}
function standings(id){const ids=db.participants.filter(x=>x.tournament_id===id).map(x=>x.team_id),rows=ids.map(id=>({id,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0})),map=new Map(rows.map(x=>[x.id,x]));db.matches.filter(m=>m.tournament_id===id&&m.status==='finished').forEach(m=>{const a=map.get(m.home_team_id),b=map.get(m.away_team_id);if(!a||!b)return;const x=Number(m.home_score),y=Number(m.away_score);if(!Number.isFinite(x)||!Number.isFinite(y))return;a.p++;b.p++;a.gf+=x;a.ga+=y;b.gf+=y;b.ga+=x;if(x>y){a.w++;b.l++;a.pts+=3}else if(x<y){b.w++;a.l++;b.pts+=3}else{a.d++;b.d++;a.pts++;b.pts++}});return rows.sort((a,b)=>b.pts-a.pts||((b.gf-b.ga)-(a.gf-a.ga))||b.gf-a.gf)}
function setPage(p){page=p;selectedTeam=null;render();scrollTo({top:0,behavior:'smooth'})}
function empty(t){return `<div class="card muted small" style="text-align:center;line-height:2">${t}</div>`}
function render(){nav.innerHTML=[['home','الرئيسية'],['teams','الفرق'],['matches','المباريات'],['leagues','البطولات']].map(([id,name])=>`<button class="${page===id?'active':''}" data-page="${id}">${svg(id)}${name}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));if(loading){content.innerHTML=empty('جارِ تحميل البيانات من قاعدة الرابطة...');return}if(error){content.innerHTML=empty('تعذّر الاتصال بقاعدة البيانات: '+esc(error));return}
if(page==='home'){const recent=[...db.matches].sort((a,b)=>new Date(b.kickoff)-new Date(a.kickoff));content.innerHTML=`<div class="hero"><div class="gold tiny">✦ المنصة الرياضية للرابطة</div><h1>ملاعبنا تجمعنا<br><span class="gold">وشغفنا يوحدنا</span></h1><p class="muted small">كل الفرق والمباريات والبطولات الشعبية بمكان واحد.</p><button class="primary" id="explore">استكشف المباريات ←</button></div><div class="stats"><div class="stat"><b>${db.teams.length}</b><span>الفرق</span></div><div class="stat"><b>${db.tournaments.length}</b><span>البطولات</span></div><div class="stat"><b>${db.matches.length}</b><span>المباريات</span></div></div><h3 class="section-title">أبرز المباريات</h3>${recent.length?recent.slice(0,3).map(match).join(''):empty('لم تُضف مباريات بعد')}<div class="card" style="margin-top:13px"><b class="gold">بطولات الرابطة</b>${db.tournaments.length?db.tournaments.slice(0,3).map(t=>`<p class="small" style="line-height:1.8">🏆 ${esc(t.name)} <span class="muted">${esc(t.season||'')}</span></p>`).join(''):'<p class="muted small">لم تُضف بطولات بعد</p>'}</div>`}
else if(page==='teams'){if(!selectedTeam){content.innerHTML=`<h2 class="section-title">الفرق الشعبية</h2><input id="search" class="search" placeholder="ابحث عن فريق..." value="${esc(search)}"><div id="teamgrid" class="teamgrid"></div>`}else{const t=team(selectedTeam),ms=db.matches.filter(m=>m.home_team_id===selectedTeam||m.away_team_id===selectedTeam),finished=ms.filter(m=>m.status==='finished');const wins=finished.filter(m=>Number(m.home_team_id===selectedTeam?m.home_score:m.away_score)>Number(m.home_team_id===selectedTeam?m.away_score:m.home_score)).length,draws=finished.filter(m=>m.home_score===m.away_score).length,losses=finished.length-wins-draws;const upcoming=ms.filter(m=>m.status==='scheduled'||m.status==='postponed').sort((a,b)=>new Date(a.kickoff)-new Date(b.kickoff));const activeRoster=profileTab==='staff'?'staff':'players';const members=db[activeRoster].filter(x=>x.team_id===selectedTeam).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)||String(a.created_at||'').localeCompare(String(b.created_at||'')));content.innerHTML=`<button class="back team-back" id="back">→ رجوع للفرق</button><section class="team-profile-head"><div class="team-identity"><div class="team-profile-crest">${crest(t)}</div><div class="team-identity-text"><h2>${esc(t.name)}</h2><p>${esc(t.description||'الملف الرسمي للفريق')}</p></div></div><div class="team-stats-row"><div><b>${wins}</b><span>فوز</span></div><div><b>${draws}</b><span>تعادل</span></div><div><b>${losses}</b><span>خسارة</span></div></div></section><div class="tabs team-single-tabs">${[['players','اللاعبون'],['staff','الكادر الفني'],['stats','الإحصائيات'],['matches','المباريات']].map(([id,n])=>`<button data-profile="${id}" class="${profileTab===id?'active':''}">${n}</button>`).join('')}</div>${profileTab==='matches'?`<h3 class="team-list-title">مباريات الفريق القادمة</h3>${upcoming.length?upcoming.map(match).join(''):empty('لا توجد مباريات قادمة')}`:profileTab==='stats'?`<h3 class="team-list-title">إحصائيات الفريق</h3><div class="team-stats-row team-detail-stats"><div><b>${finished.length}</b><span>مباريات</span></div><div><b>${wins}</b><span>فوز</span></div><div><b>${draws}</b><span>تعادل</span></div><div><b>${losses}</b><span>خسارة</span></div></div><div class="card"><h3>🏆 سجل الألقاب والإنجازات</h3>${(db.honors||[]).filter(h=>h.team_id===selectedTeam).length?(db.honors||[]).filter(h=>h.team_id===selectedTeam).sort((a,b)=>String(b.season||'').localeCompare(String(a.season||''))).map(h=>`<div class="team-honor-item"><span class="team-honor-icon">🏆</span><div><strong>${esc(h.title)}</strong><p class="muted small">${esc(h.season||'موسم غير محدد')} · ${esc(({champion:'بطل',runner_up:'وصيف',third:'المركز الثالث',other:'إنجاز'})[h.achievement]||'إنجاز')}</p></div></div>`).join(''):'<p class="muted small">لم تُسجّل ألقاب لهذا الفريق بعد.</p>'}</div>`:`<div class="team-list-heading"><h3>${profileTab==='staff'?'الكادر الفني':'قائمة اللاعبين'}</h3><span>${members.length} ${profileTab==='staff'?'أعضاء':'لاعب'}</span></div><div class="roster-list">${members.length?members.map(x=>`<div class="roster-card" ${activeRoster==='players'?`data-player-id="${esc(x.id)}" role="button" tabindex="0"`:``}><div class="roster-avatar">${x.photo_url?`<img src="${esc(x.photo_url)}" alt="صورة ${esc(x.name)}" loading="lazy">`:'<span>👤</span>'}</div><div class="roster-info"><strong>${esc(x.name)}</strong><span>${esc(activeRoster==='players'?x.position:x.role)}</span><small>${esc(t.name)}</small></div>${activeRoster==='players'&&x.shirt_number!==null?`<b class="roster-number">${x.shirt_number}</b>`:''}</div>`).join(''):empty('لم تُضف بيانات لهذا القسم بعد')}</div>`}}`}}
else if(page==='matches'){const games=db.matches.filter(m=>filter==='all'||(filter==='done'?m.status==='finished':filter==='next'?m.status==='scheduled':m.status==='live')).sort((a,b)=>new Date(b.kickoff)-new Date(a.kickoff));content.innerHTML=`<h2 class="section-title">مركز المباريات</h2><div class="tabs">${[['all','الكل'],['done','المنتهية'],['next','القادمة'],['live','المباشرة']].map(([id,n])=>`<button data-filter="${id}" class="${filter===id?'active':''}">${n}</button>`).join('')}</div>${games.length?games.map(match).join(''):empty('لا توجد مباريات بهذا القسم')}`}
else{const t=db.tournaments.find(t=>t.id===selectedTournament)||db.tournaments[0];content.innerHTML=`<h2 class="section-title">البطولات والترتيب</h2>${db.tournaments.length?`<div class="tabs" style="overflow:auto">${db.tournaments.map(x=>`<button data-league="${x.id}" class="${t.id===x.id?'active':''}">${esc(x.name)}</button>`).join('')}</div><div class="card"><b class="gold">${esc(t.name)}</b><p class="muted small">${t.kind==='cup'?'بطولة كأس':'بطولة دوري'} · ${esc(t.season||'')}</p>${t.kind==='league'?`<div style="overflow:auto"><table class="table"><thead><tr><th>الفريق</th><th>لعب</th><th>فارق</th><th>نقاط</th></tr></thead><tbody>${standings(t.id).map(r=>`<tr><td>${esc(team(r.id).name)}</td><td>${r.p}</td><td>${r.gf-r.ga}</td><td>${r.pts}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted small">مواجهات بطولة الكأس تظهر أدناه</p>'}</div><h3 class="section-title">مباريات البطولة</h3>${db.matches.filter(m=>m.tournament_id===t.id).map(match).join('')||empty('لا توجد مباريات لهذه البطولة')}`:empty('لم تُضف بطولات بعد')}`}
bind()}
function fillTeams(){const grid=document.getElementById('teamgrid');if(!grid)return;const matches=db.teams.filter(t=>t.name.includes(search));grid.innerHTML=matches.map(t=>`<button class="card teamcard" data-team="${esc(t.id)}">${crest(t)}<strong>${esc(t.name)}</strong><span class="gold">عرض الملف ←</span></button>`).join('')||'<p class="muted">لا توجد فرق مطابقة</p>';grid.querySelectorAll('button').forEach(b=>b.onclick=()=>{selectedTeam=b.dataset.team;render()})}
function bind(){document.getElementById('explore')?.addEventListener('click',()=>setPage('matches'));document.getElementById('back')?.addEventListener('click',()=>{selectedTeam=null;render()});const input=document.getElementById('search');if(input){input.addEventListener('input',e=>{search=e.target.value;fillTeams()});fillTeams()}content.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>{profileTab=b.dataset.profile;render()});content.querySelectorAll('[data-roster]').forEach(b=>b.onclick=()=>{rosterTab=b.dataset.roster;render()});content.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});content.querySelectorAll('[data-league]').forEach(b=>b.onclick=()=>{selectedTournament=b.dataset.league;render()})}
async function refresh(){try{const names=['mans_teams','mans_tournaments','mans_tournament_teams','mans_matches','mans_players','mans_staff','mans_team_honors'];const result=await Promise.all(names.map(t=>sb.from(t).select('*')));const failed=result.find(r=>r.error);if(failed)throw failed.error;db={teams:result[0].data,tournaments:result[1].data,participants:result[2].data,matches:result[3].data,players:result[4].data,staff:result[5].data,honors:result[6].data};error=''}catch(e){error=e.message||String(e)}finally{loading=false;if(page!=='smart'&&page!=='feature')render()}}
refresh();setInterval(refresh,30000);['mans_teams','mans_tournaments','mans_tournament_teams','mans_matches','mans_team_honors'].forEach(t=>sb.channel('mans-public-'+t).on('postgres_changes',{event:'*',schema:'public',table:t},refresh).subscribe());
</script><script src="features.js"></script><script src="image-utils.js"></script><script src="smart.js"></script><script>if("serviceWorker" in navigator && location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});</script></body></html>
